<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>ScanForge - test di contratto API</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; color: #222; }
  table { border-collapse: collapse; margin-top: 12px; }
  td, th { border: 1px solid #ccc; padding: 4px 10px; text-align: left; }
  .pass { color: #0a7a2f; }
  .fail { color: #b00020; font-weight: 600; }
  #summary { font-weight: 600; }
  iframe { position: absolute; left: -9999px; width: 800px; height: 600px; border: 0; }
</style>
</head>
<body>
<h1>Contratto pubblico API</h1>
<p id="summary">In corso...</p>
<table id="results"><thead><tr><th>Test</th><th>Esito</th><th>Dettaglio</th></tr></thead><tbody></tbody></table>
<iframe id="app" src="../index.html" title="app"></iframe>
<script src="lib/api-manifest.js"></script>
<script src="lib/synth.js"></script>
<script src="lib/whatsapp.js"></script>
<script src="reference/ref02.js"></script>
<script>
(function () {
  var rows = [];
  var failures = [];
  var warnings = [];

  // Percorso a punti ("io.loadImage") risolto sull'oggetto ScanForge dell'iframe.
  function resolve(root, path) {
    return path.split('.').reduce(function (o, k) { return o == null ? undefined : o[k]; }, root);
  }

  function check(name, fn) {
    var ok = false, detail = '';
    try {
      var r = fn();
      ok = r === true;
      if (!ok) detail = String(r);
    } catch (e) {
      detail = String(e && e.message || e);
    }
    rows.push({ name: name, ok: ok, detail: detail });
    if (!ok) failures.push(name + (detail ? ' - ' + detail : ''));
  }

  // Verifica asincrona: la riga si riserva subito (ordine stabile) e si completa a promessa risolta.
  var pending = [];
  function checkAsync(name, fn) {
    var row = { name: name, ok: false, detail: '' };
    rows.push(row);
    pending.push(Promise.resolve().then(fn).then(function (r) {
      row.ok = r === true;
      if (!row.ok) row.detail = String(r);
    }, function (e) {
      row.detail = String(e && e.message || e);
    }).then(function () {
      if (!row.ok) failures.push(name + (row.detail ? ' - ' + row.detail : ''));
    }));
  }

  function sameBytes(a, b) {
    if (a.length !== b.length) return 'lunghezza ' + a.length + ' contro ' + b.length;
    for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return 'byte diverso alla posizione ' + i;
    return true;
  }

  // Sezione io: PDF, progetti, nome file. Il riferimento e Ref02 (la 0.2 alla lettera).
  function ioTests(sf, win) {
    var io = sf && sf.io;
    function jpeg(n) { var b = new Uint8Array(n); b[0] = 0xFF; b[1] = 0xD8; b[n - 1] = 0xD9; return b; }
    function pdfPages() {
      return [
        { bytes: jpeg(10), width: 100, height: 50 },
        { bytes: jpeg(10), width: 100, height: 50, ptW: 595.28, ptH: 841.89 }
      ];
    }
    function projState() {
      return {
        projectName: 'Pratica Rossi',
        a4Compose: true,
        pages: [
          { originalSrc: 'data:image/jpeg;base64,AAAA', name: 'a.jpg', settings: Ref02.defaultSettings(), corners: Ref02.defaultCorners(), width: 10, height: 20, docGroup: 1, docSide: 'fronte', id: 5 },
          { originalSrc: 'data:image/jpeg;base64,BBBB', name: 'b.jpg', settings: Ref02.defaultSettings(), corners: Ref02.defaultCorners(), width: 30, height: 40, docGroup: null, docSide: 'retro' }
        ]
      };
    }

    checkAsync('io.buildPdf ha gli stessi byte di Ref02.buildPdf', function () {
      return Ref02.buildPdf(pdfPages()).arrayBuffer().then(function (ab) {
        var mine = io.buildPdf(pdfPages());
        if (!(mine instanceof win.Uint8Array)) return 'non restituisce Uint8Array';
        return sameBytes(mine, new Uint8Array(ab));
      });
    });
    check('io.serializeProject uguale a Ref02.serializeProject', function () {
      var a = io.serializeProject(projState()), b = Ref02.serializeProject(projState());
      return a === b ? true : 'stringhe diverse: ' + a.slice(0, 80) + ' / ' + b.slice(0, 80);
    });
    check('io.parseProject su un progetto 0.2 completa le impostazioni', function () {
      var st = projState();
      st.pages[0].settings = { contrast: 12, brightness: 3, sharpen: 1, bw: true, autoEnhance: false, shadows: false, perspective: true };
      delete st.pages[1].corners; delete st.pages[1].docSide; delete st.pages[1].name;
      var p = io.parseProject(Ref02.serializeProject(st));
      var s0 = p.pages[0].settings, def = sf.defaultSettings();
      if (p.projectName !== 'Pratica Rossi' || p.a4Compose !== true || p.pages.length !== 2) return 'testata errata';
      if (s0.keystoneV !== 0 || s0.keystoneH !== 0 || s0.rotFine !== 0) return 'campi nuovi mancanti';
      if (s0.contrast !== 12 || s0.bw !== true) return 'valori del progetto persi';
      if (Object.keys(def).some(function (k) { return !(k in s0); })) return 'impostazioni incomplete';
      var q = p.pages[1];
      if (q.docSide !== 'fronte' || q.name !== 'pagina') return 'predefiniti di pagina errati';
      if (JSON.stringify(q.corners) !== JSON.stringify(Ref02.defaultCorners())) return 'angoli predefiniti errati';
      if (q.docGroup !== null || q.originalSrc !== 'data:image/jpeg;base64,BBBB') return 'pagina errata';
      return true;
    });
    check('io: flipH, flipV e bilanciaBianco si salvano e si rileggono come booleani', function () {
      var st = projState();
      st.pages[0].settings = Object.assign({}, st.pages[0].settings, { flipH: true, flipV: false, bilanciaBianco: false });
      var s0 = io.parseProject(io.serializeProject(st)).pages[0].settings;
      return s0.flipH === true && s0.flipV === false && s0.bilanciaBianco === false ? true : JSON.stringify(s0);
    });
    ['flipH', 'flipV', 'bilanciaBianco'].forEach(function (k) {
      check('io: ' + k + ' non booleano è bad-input', function () {
        var st = {};
        st[k] = 'si';
        try { io.checkSettings(st, 'Impostazioni'); } catch (e) { return e && e.code === 'bad-input' ? true : 'codice ' + (e && e.code); }
        return 'non ha rifiutato';
      });
    });
    ['{', '{"pages":3}', 'null', '[]'].forEach(function (txt) {
      check('io.parseProject rifiuta ' + txt + ' con bad-input', function () {
        try { io.parseProject(txt); } catch (e) { return e && e.code === 'bad-input' ? true : 'codice ' + (e && e.code); }
        return 'non ha rifiutato';
      });
    });
    // ---- Allegato PDF e progetto con pratica ----
    var NOME_ALL = 'scanforge-progetto.json';
    function asciiAll(b) { var s = ''; for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return s; }
    check('io.buildPdf con allegato: xref coerente e allegato leggibile', function () {
      var bytes = new win.TextEncoder().encode('{"a":1,"b":"è"}');
      var pdf = io.buildPdf(pdfPages(), { attachment: { name: NOME_ALL, bytes: bytes } });
      if (asciiAll(pdf.subarray(0, 8)) !== '%PDF-1.4') return 'intestazione errata';
      var s = asciiAll(pdf);
      var sx = /startxref\n(\d+)\n%%EOF$/.exec(s);
      if (!sx) return 'startxref mancante';
      var x = Number(sx[1]);
      var m = /^xref\n0 (\d+)\n/.exec(s.slice(x));
      if (!m) return 'xref non trovato';
      var tot = Number(m[1]);
      if (tot !== 3 + 2 * 3 + 2) return 'oggetti ' + tot;
      if (s.indexOf('/Size ' + tot + ' ') < 0) return 'Size errata';
      var righe = s.slice(x + m[0].length).split('\n');
      for (var i = 1; i < tot; i++) {
        var off = Number(righe[i + 0].slice(0, 10));
        if (s.slice(off, off + (i + ' 0 obj').length) !== i + ' 0 obj') return 'offset errato per ' + i;
      }
      var r = sf.model.readPdfAttachment(pdf);
      if (!r) return 'allegato non letto';
      return sameBytes(r, bytes);
    });
    check('io.buildPdf rifiuta un nome di allegato diverso', function () {
      try { io.buildPdf(pdfPages(), { attachment: { name: 'altro.json', bytes: new Uint8Array(1) } }); }
      catch (e) { return e instanceof win.TypeError || e instanceof TypeError ? true : 'tipo errore ' + e; }
      return 'non ha rifiutato';
    });
    check('io.buildPdf con opts vuote ha i byte di sempre', function () {
      return sameBytes(io.buildPdf(pdfPages(), {}), io.buildPdf(pdfPages()));
    });
    function praticaProva() {
      return {
        cognome: 'Rossi', nome: 'Mario',
        documents: [
          { id: 'd1', typeId: 'cie', mode: 'grigi', pageIds: ['A', 'B'] },
          { id: 'd2', typeId: 'contratto', mode: null, pageIds: ['C'] }
        ],
        unassigned: ['D']
      };
    }
    function statoPratica() {
      var st = projState();
      var mk = function (id, n) { return { originalSrc: 'data:image/jpeg;base64,' + n, name: n + '.jpg', settings: Ref02.defaultSettings(), corners: Ref02.defaultCorners(), width: 10, height: 10, docGroup: null, docSide: 'fronte', id: id }; };
      st.pages = [mk('A', 'AAAA'), mk('B', 'BBBB'), mk('C', 'CCCC'), mk('D', 'DDDD')];
      st.practice = praticaProva();
      return st;
    }
    check('io.serializeProject con pratica ricava docGroup e docSide', function () {
      var d = JSON.parse(io.serializeProject(statoPratica()));
      if (!d.practice || d.practice.cognome !== 'Rossi' || d.practice.nome !== 'Mario') return 'pratica assente';
      if (d.pages.some(function (p) { return 'id' in p; })) return 'id scritto nelle pagine';
      if (JSON.stringify(d.practice.documents[0].pageIds) !== '["p0","p1"]') return 'pageIds non rimappati';
      if (JSON.stringify(d.practice.unassigned) !== '["p3"]') return 'unassigned errato';
      var g = d.pages;
      if (g[0].docGroup === null || g[0].docGroup !== g[1].docGroup) return 'tessera non raggruppata';
      if (g[0].docSide !== 'fronte' || g[1].docSide !== 'retro') return 'lati errati';
      if (g[2].docGroup !== null || g[2].docSide !== 'fronte') return 'foglio errato';
      return true;
    });
    check('io.serializeProject: pratica a pagine non referenziate le mette in unassigned', function () {
      var st = statoPratica(); st.practice.unassigned = [];
      var d = JSON.parse(io.serializeProject(st));
      return JSON.stringify(d.practice.unassigned) === '["p3"]' ? true : JSON.stringify(d.practice.unassigned);
    });
    check('io.serializeProject rifiuta una pratica con pageId inesistente', function () {
      var st = statoPratica(); st.practice.documents[1].pageIds = ['Z'];
      try { io.serializeProject(st); } catch (e) { return e && e.code === 'bad-input' ? true : 'codice ' + (e && e.code); }
      return 'non ha rifiutato';
    });
    [
      ['tessera di 3 pagine', function (st) { st.practice.documents[0].pageIds = ['A', 'B', 'D']; st.practice.unassigned = []; }],
      ['pageId in due documenti', function (st) { st.practice.documents[1].pageIds = ['A']; }],
      ['id documento duplicato', function (st) { st.practice.documents[1].id = 'd1'; }],
      ['due pagine con lo stesso id', function (st) { st.pages[3].id = 'A'; st.practice.unassigned = []; }]
    ].forEach(function (c) {
      check('io.serializeProject rifiuta una pratica con ' + c[0], function () {
        var st = statoPratica(); c[1](st);
        try { io.serializeProject(st); } catch (e) { return e && e.code === 'bad-input' ? true : 'codice ' + (e && e.code); }
        return 'non ha rifiutato';
      });
    });
    check('una pratica valida fa andata e ritorno identica', function () {
      var t = io.serializeProject(statoPratica());
      var t2 = io.serializeProject(io.parseProject(t));
      return t === t2 ? true : 'testi diversi';
    });
    check('andata e ritorno della pratica: serializeProject e parseProject', function () {
      var p = io.parseProject(io.serializeProject(statoPratica()));
      var attesa = { title: '', cognome: 'Rossi', nome: 'Mario', documents: [
        { id: 'd1', typeId: 'cie', mode: 'grigi', pageIds: ['p0', 'p1'] },
        { id: 'd2', typeId: 'contratto', mode: null, pageIds: ['p2'] }
      ], unassigned: ['p3'] };
      if (JSON.stringify(p.practice) !== JSON.stringify(attesa)) return JSON.stringify(p.practice);
      if (p.pages.map(function (x) { return x.id; }).join() !== 'p0,p1,p2,p3') return 'id pagine errati';
      return true;
    });
    // Nome del progetto: practice.title facoltativo ('' = automatico)
    check('practice.title: andata e ritorno del nome scritto', function () {
      var st = statoPratica(); st.practice.title = 'Contratto Casa Milano';
      var t = io.serializeProject(st);
      if (JSON.parse(t).practice.title !== 'Contratto Casa Milano') return 'non scritto';
      var p = io.parseProject(t);
      if (p.practice.title !== 'Contratto Casa Milano') return 'riletto: ' + p.practice.title;
      return io.serializeProject(p) === t ? true : 'secondo giro diverso';
    });
    check('practice.title assente o vuoto: non si scrive e si legge come vuoto', function () {
      var d1 = JSON.parse(io.serializeProject(statoPratica()));
      var st = statoPratica(); st.practice.title = '   ';
      var d2 = JSON.parse(io.serializeProject(st));
      if ('title' in d1.practice || 'title' in d2.practice) return 'scritto';
      return io.parseProject(JSON.stringify(d1)).practice.title === '' ? true : 'letto non vuoto';
    });
    check('practice.title troppo lungo si accorcia a 80 e si pulisce dagli spazi', function () {
      var d = JSON.parse(io.serializeProject(statoPratica()));
      d.practice.title = 'x'.repeat(200);
      var lungo = io.parseProject(JSON.stringify(d)).practice.title;
      if (lungo.length !== 80) return 'lunghezza ' + lungo.length;
      d.practice.title = '  Casa  ';
      var spazi = io.parseProject(JSON.stringify(d)).practice.title;
      return spazi === 'Casa' ? true : JSON.stringify(spazi);
    });
    check('io.parseProject rifiuta practice.title che non è una stringa', function () {
      var d = JSON.parse(io.serializeProject(statoPratica()));
      d.practice.title = 5;
      try { io.parseProject(JSON.stringify(d)); } catch (e) { return e && e.code === 'bad-input' ? true : 'codice ' + (e && e.code); }
      return 'non ha rifiutato';
    });
    check('io.parseProject di un progetto 0.2 dà la pratica di fromLegacy', function () {
      var p = io.parseProject(Ref02.serializeProject(projState()));
      var att = sf.model.fromLegacy(p.pages);
      if (JSON.stringify(p.practice) !== JSON.stringify(att)) return JSON.stringify(p.practice);
      return p.pages[0].id === 'p0' ? true : 'id errato';
    });
    check('io.parseProject di un progetto 0.2 con A4 spento ignora docGroup', function () {
      var st = projState();
      st.a4Compose = false;
      st.pages = [1, 1, 2, 2].map(function (g, i) {
        return { originalSrc: 'data:image/jpeg;base64,AAAA', name: 'p' + i + '.jpg', settings: Ref02.defaultSettings(),
          corners: Ref02.defaultCorners(), width: 10, height: 10, docGroup: g, docSide: i % 2 ? 'retro' : 'fronte' };
      });
      var p = io.parseProject(Ref02.serializeProject(st));
      var docs = p.practice.documents;
      if (docs.length !== 1 || docs[0].typeId !== 'generico' || docs[0].pageIds.join() !== 'p0,p1,p2,p3') return JSON.stringify(docs);
      var plan = sf.model.exportPlan(p.practice, sf.model.TYPES, false);
      var a4 = plan[0].items.map(function (x) { return x.a4; });
      return a4.length === 4 && a4.every(function (x) { return x === false; }) ? true : JSON.stringify(a4);
    });
    function conPratica(mod) {
      var d = JSON.parse(io.serializeProject(statoPratica()));
      mod(d.practice);
      return JSON.stringify(d);
    }
    [
      ['pageId inesistente', function (p) { p.documents[1].pageIds = ['p9']; }],
      ['tessera di 3 pagine', function (p) { p.documents[0].pageIds = ['p0', 'p1', 'p3']; p.unassigned = []; }],
      ['pageId doppio', function (p) { p.documents[1].pageIds = ['p0']; }],
      ['modo sconosciuto', function (p) { p.documents[0].mode = 'rosa'; }],
      ['documents non array', function (p) { p.documents = 3; }],
      ['typeId non stringa', function (p) { p.documents[0].typeId = 7; }],
      ['cognome non stringa', function (p) { p.cognome = 5; }],
      ['unassigned non array', function (p) { p.unassigned = 'p3'; }]
    ].forEach(function (c) {
      check('io.parseProject rifiuta una pratica con ' + c[0], function () {
        try { io.parseProject(conPratica(c[1])); } catch (e) { return e && e.code === 'bad-input' && e.message === 'File progetto non valido' ? true : 'errore ' + (e && e.code); }
        return 'non ha rifiutato';
      });
    });
    check('io.parseProject: pagine fuori dalla pratica vanno in unassigned', function () {
      var t = conPratica(function (p) { p.unassigned = []; });
      var p = io.parseProject(t);
      return JSON.stringify(p.practice.unassigned) === '["p3"]' ? true : JSON.stringify(p.practice.unassigned);
    });
    check('io.parseProject: tipo sconosciuto è un foglio, anche con 3 pagine', function () {
      var t = conPratica(function (p) { p.documents[1].typeId = 'xyz'; p.documents[1].pageIds = ['p2', 'p3', 'p1']; p.documents[0].pageIds = ['p0']; p.unassigned = []; });
      return io.parseProject(t).practice.documents[1].pageIds.length === 3 ? true : 'rifiutato';
    });
    // Tipi propri: la definizione viaggia nella pratica (practice.types)
    var TIPI_PROPRI = [
      { id: 'proprio1', label: 'Tesserino', sigla: 'Tes', family: 'tessera' },
      { id: 'proprio2', label: 'Delega', sigla: 'Del', family: 'foglio' },
      { id: 'proprio3', label: 'Mai usato', sigla: 'Mu', family: 'foglio' }
    ];
    function statoTipiPropri() {
      var st = statoPratica();
      st.practice.documents = [
        { id: 'd1', typeId: 'proprio1', mode: null, pageIds: ['A', 'B'] },
        { id: 'd2', typeId: 'proprio2', mode: null, pageIds: ['C', 'D'] }
      ];
      st.practice.unassigned = [];
      st.types = sf.model.TYPES.concat(TIPI_PROPRI);
      return st;
    }
    check('tipi propri: andata e ritorno con definizioni, docGroup e docSide', function () {
      var t = io.serializeProject(statoTipiPropri());
      var d = JSON.parse(t);
      var attesi = JSON.stringify(TIPI_PROPRI.slice(0, 2));
      if (JSON.stringify(d.practice.types) !== attesi) return 'tipi scritti: ' + JSON.stringify(d.practice.types);
      var g = d.pages;
      if (g[0].docGroup === null || g[0].docGroup !== g[1].docGroup) return 'tessera propria non raggruppata';
      if (g[0].docSide !== 'fronte' || g[1].docSide !== 'retro') return 'lati della tessera propria errati';
      if (g[2].docGroup !== null || g[3].docGroup !== null) return 'foglio proprio raggruppato';
      var p = io.parseProject(t);
      if (JSON.stringify(p.practice.types) !== attesi) return 'tipi riletti: ' + JSON.stringify(p.practice.types);
      return io.serializeProject(Object.assign(p, { types: sf.model.TYPES.concat(p.practice.types) })) === t ? true : 'secondo giro diverso';
    });
    check('tipi predefiniti mai scritti in practice.types', function () {
      var d = JSON.parse(io.serializeProject(Object.assign(statoPratica(), { types: sf.model.TYPES.concat(TIPI_PROPRI) })));
      return d.practice.types === undefined ? true : JSON.stringify(d.practice.types);
    });
    function conTipi(mod) {
      var d = JSON.parse(io.serializeProject(statoTipiPropri()));
      mod(d.practice);
      return JSON.stringify(d);
    }
    [
      ['types non array', function (p) { p.types = {}; }],
      ['id predefinito', function (p) { p.types[0].id = 'cie'; p.documents[0].typeId = 'cie'; }],
      ['id doppio', function (p) { p.types[1].id = 'proprio1'; }],
      ['nome vuoto', function (p) { p.types[0].label = '  '; }],
      ['nome di 61 caratteri', function (p) { p.types[0].label = new Array(62).join('a'); }],
      ['sigla vuota dopo la pulizia', function (p) { p.types[0].sigla = ' . '; }],
      ['sigla di 21 caratteri', function (p) { p.types[0].sigla = new Array(22).join('s'); }],
      ['famiglia sconosciuta', function (p) { p.types[0].family = 'busta'; }],
      ['tipo non usato da nessun documento', function (p) { p.types.push({ id: 'proprio7', label: 'Avanzo', sigla: 'Av', family: 'foglio' }); }],
      ['tessera propria di 3 pagine', function (p) { p.documents[0].pageIds = ['p0', 'p1', 'p2']; p.documents[1].pageIds = ['p3']; }]
    ].forEach(function (c) {
      check('io.parseProject rifiuta practice.types con ' + c[0], function () {
        try { io.parseProject(conTipi(c[1])); } catch (e) { return e && e.code === 'bad-input' ? true : 'errore ' + (e && e.code); }
        return 'non ha rifiutato';
      });
    });
    check('io.serializeProject rifiuta una tessera propria di 3 pagine', function () {
      var st = statoTipiPropri(); st.practice.documents[0].pageIds = ['A', 'B', 'C']; st.practice.documents[1].pageIds = ['D'];
      try { io.serializeProject(st); } catch (e) { return e && e.code === 'bad-input' ? true : 'codice ' + (e && e.code); }
      return 'non ha rifiutato';
    });
    check('practice.types con 5000 tipi non usati rifiutata in meno di 200 ms', function () {
      var t = conTipi(function (p) {
        p.types = [];
        for (var i = 0; i < 5000; i++) p.types.push({ id: 'x' + i, label: 'Tipo ' + i, sigla: 'T' + i, family: 'foglio' });
      });
      var t0 = win.performance.now(), codice = null;
      try { io.parseProject(t); } catch (e) { codice = e && e.code; }
      var ms = win.performance.now() - t0;
      if (codice !== 'bad-input') return 'codice ' + codice;
      return ms < 200 ? true : 'lento: ' + Math.round(ms) + ' ms';
    });
    check('practice.types: sigla con spazi e punti finali pulita come nelle Impostazioni', function () {
      var p = io.parseProject(conTipi(function (p) { p.types[0].sigla = ' Tes. . '; }));
      return p.practice.types[0].sigla === 'Tes' ? true : JSON.stringify(p.practice.types[0].sigla);
    });
    check('practice.types: sigla pulita come un nome di file', function () {
      var p = io.parseProject(conTipi(function (p) { p.types[0].sigla = 'T/s:'; }));
      return p.practice.types[0].sigla === 'T-s-' ? true : p.practice.types[0].sigla;
    });
    check('io.projectFromPdf restituisce il testo dell\'allegato o null', function () {
      var testo = '{"x":"èà"}';
      var pdf = io.buildPdf(pdfPages(), { attachment: { name: NOME_ALL, bytes: new win.TextEncoder().encode(testo) } });
      if (io.projectFromPdf(pdf) !== testo) return 'testo diverso';

    // Il browser tiene in cache le immagini data: già decodificate: il riferimento va preso per

  // Contratto di detectDocument e process senza ops, preset congelati, caricamento UMD.
  function topLevelTests(sf, win) {
    function loaded(name) {
      var m = Synth.make(Synth.cases[name]);
      return sf.io.loadImage(m.dataUrl, { maxDim: Infinity }).then(function (img) { return { img: img, corners: m.corners }; });
    }
    function sameCorners(a, b) {
      return ['tl', 'tr', 'br', 'bl'].every(function (k) { return a[k].x === b[k].x && a[k].y === b[k].y; });
    }

    checkAsync('detectDocument(img) senza ops funziona e coincide con quella con ops', function () {
      return loaded('A-ombra').then(function (L) {
        var senza = sf.detectDocument(L.img), con = sf.detectDocument(L.img, sf.io.createOps());
        if (!senza.corners || senza.method !== 'otsu-v0') return 'risultato ' + JSON.stringify(senza);
        return sameCorners(senza.corners, con.corners) ? true : 'angoli diversi';
      });
    });
    checkAsync('detectDocument(img) senza ops su immagine uniforme da corners null', function () {
      var c = document.createElement('canvas'); c.width = 800; c.height = 600;
      var x = c.getContext('2d'); x.fillStyle = 'rgb(100,100,100)'; x.fillRect(0, 0, 800, 600);
      return sf.io.loadImage(c.toDataURL('image/png'), { maxDim: Infinity }).then(function (img) {
        return sf.detectDocument(img).corners === null ? true : 'corners non null';
      });
    });
    checkAsync('process(img, opts) senza ops da lo stesso risultato che con ops', function () {
      return loaded('A-ombra').then(function (L) {
        var settings = Object.assign(sf.defaultSettings(), sf.presets.id, { rotFine: 2, keystoneV: 4 });
        var opts = function () { return { corners: JSON.parse(JSON.stringify(L.corners)), settings: Object.assign({}, settings) }; };
        var senza = sf.process(L.img, opts());
        var con = sf.process(L.img, opts(), sf.io.createOps());
        if (senza.width !== con.width || senza.height !== con.height) return 'dimensioni diverse';
        return sameBytes(senza.data, con.data);
      });
    });
    checkAsync('process senza ops con ombre e rotazione non lancia', function () {
      return loaded('A-ombra').then(function (L) {
        var out = sf.process(L.img, { corners: L.corners, settings: Object.assign(sf.defaultSettings(), { shadows: true, rotFine: 3 }) });
        return out && out.width > 0 ? true : 'nessun risultato';
      });
    });
    checkAsync('process accetta corners null senza prospettiva', function () {
      return loaded('A-ombra').then(function (L) {
        var out = sf.process(L.img, { corners: null, settings: Object.assign(sf.defaultSettings(), { perspective: false }) });
        return out.width === L.img.width && out.height === L.img.height ? true : 'dimensioni cambiate';
      });
    });
    checkAsync('process con mode originale senza ops funziona e non lascia alfa 0', function () {
      return loaded('A-ombra').then(function (L) {
        var out = sf.process(L.img, { corners: L.corners, settings: Object.assign(sf.defaultSettings(), { mode: 'originale' }) });
        if (!out || !out.width) return 'nessun risultato';
        for (var i = 3; i < out.data.length; i += 4) if (out.data[i] === 0) return 'alfa 0 alla posizione ' + i;
        return true;
      });
    });
    checkAsync('process con mode originale e rotazione (ops canvas) non lascia alfa 0', function () {
      return loaded('A-ombra').then(function (L) {
        var out = sf.process(L.img, { corners: L.corners, settings: Object.assign(sf.defaultSettings(), { mode: 'originale', rotFine: 3 }) });
        for (var i = 3; i < out.data.length; i += 4) if (out.data[i] === 0) return 'alfa 0 alla posizione ' + i;
        return true;
      });
    });
    check('process con mode non valida lancia TypeError', function () {
      var img = { data: new Uint8ClampedArray(16 * 16 * 4), width: 16, height: 16 };
      try { sf.process(img, { corners: null, settings: Object.assign(sf.defaultSettings(), { mode: 'xyz' }) }); } catch (e) {
        return (e instanceof win.TypeError && /mode non valida/.test(e.message)) ? true : 'errore ' + e;
      }
      return 'non ha lanciato';
    });
    checkAsync('process senza mode resta il percorso 0.2 (stessi byte del core)', function () {
      return loaded('A-ombra').then(function (L) {
        var settings = Object.assign(sf.defaultSettings(), sf.presets.document, { rotFine: 2 });
        var opts = function () { return { corners: JSON.parse(JSON.stringify(L.corners)), settings: Object.assign({}, settings) }; };
        var a = sf.process(L.img, opts()), b = sf.core.process(L.img, opts(), sf.io.createOps());
        if (a.width !== b.width || a.height !== b.height) return 'dimensioni diverse';

    check('il blocco sf-core con un global module riempie anche globalThis.ScanForge', function () {

    });
  }

  // Sezione whatsapp: simulatore dell'invio via WhatsApp (riduzione a 1600 px, JPEG 0,65).
  function whatsappTests() {
    function bigSynth() {
      return Synth.make(Object.assign({}, Synth.cases['A-ombra'], { w: 2400, h: 1800 }));
    }
    function jpegBytes(canvas, q) {
      return new Promise(function (res, rej) {
        canvas.toBlob(function (b) { b ? res(b.arrayBuffer()) : rej(new Error('toBlob fallito')); }, 'image/jpeg', q);
      }).then(function (ab) { return new Uint8Array(ab); });
    }
    // Intestazione JPEG minima: SOI, APP0, SOF con le componenti indicate, EOI.
    function header(sofMarker, w, h, comps) {
      var app0 = [0xFF, 0xE0, 0x00, 0x10, 0x4A, 0x46, 0x49, 0x46, 0x00, 0x01, 0x01, 0x00, 0x00, 0x01, 0x00, 0x01, 0x00, 0x00];
      var len = 8 + comps.length * 3;
      var sof = [0xFF, sofMarker, len >> 8, len & 255, 8, h >> 8, h & 255, w >> 8, w & 255, comps.length];
      comps.forEach(function (c, i) { sof.push(i + 1, c, 0); });
      return new Uint8Array([0xFF, 0xD8].concat(app0, sof, [0xFF, 0xD9]));
    }

    checkAsync('Whatsapp.degrade porta A-ombra 2400x1800 al lato lungo 1600', function () {
      var m = bigSynth();
      return Whatsapp.degrade(m.canvas).then(function (out) {
        if (!(out instanceof HTMLCanvasElement)) return 'non restituisce un canvas';
        if (m.canvas.width !== 2400 || m.canvas.height !== 1800) return 'l\'ingresso è stato modificato';
        return (out.width === 1600 && out.height === 1200) ? true : out.width + 'x' + out.height;
      });
    });
    checkAsync('Whatsapp.degrade non ingrandisce un\'immagine più piccola di 1600 px', function () {
      var m = Synth.make(Synth.cases['A-ombra']);
      return Whatsapp.degrade(m.canvas).then(function (out) {
        return (out.width === 800 && out.height === 600) ? true : out.width + 'x' + out.height;
      });
    });
    checkAsync('Whatsapp.degrade rifa il passaggio JPEG: i pixel cambiano e restano vicini', function () {
      var m = Synth.make(Synth.cases['A-ombra']);
      return Whatsapp.degrade(m.canvas).then(function (out) {
        var a = m.canvas.getContext('2d').getImageData(0, 0, 800, 600).data;
        var b = out.getContext('2d').getImageData(0, 0, out.width, out.height).data;
        var diff = 0, sum = 0;
        for (var i = 0; i < a.length; i += 4) {
          var d = Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]);
          if (d) diff++;
          sum += d / 3;
        }
        if (!diff) return 'nessun pixel cambiato: manca la compressione';
        var mean = sum / (a.length / 4);
        return mean < 12 ? true : 'differenza media troppo alta: ' + mean.toFixed(2);
      });
    });
    checkAsync('jpegInfo sui byte di toBlob a 0,65 riporta misure e 4:2:0 (altrimenti avviso)', function () {
      var m = bigSynth();
      return jpegBytes(m.canvas, 0.65).then(function (bytes) {
        var info = Whatsapp.jpegInfo(bytes);
        if (info.w !== 2400 || info.h !== 1800) return 'misure ' + info.w + 'x' + info.h;
        if (info.ySampling !== '2x2') {
          // Il browser non produce 4:2:0 a questa qualità: il simulatore resta valido ma
          // la prova di fedelta cade. Si segnala, non si boccia il banco.
          warnings.push('toBlob a qualità 0,65 produce ySampling ' + info.ySampling + ' invece di 2x2');
        }
        return true;
      });
    });
    check('jpegInfo legge SOF0 con campionamento 2x2', function () {
      var i = Whatsapp.jpegInfo(header(0xC0, 640, 480, [0x22, 0x11, 0x11]));
      return (i.w === 640 && i.h === 480 && i.ySampling === '2x2') ? true : JSON.stringify(i);
    });
    check('jpegInfo legge SOF2 (progressivo) con campionamento 1x1', function () {
      var i = Whatsapp.jpegInfo(header(0xC2, 300, 200, [0x11, 0x11, 0x11]));
      return (i.w === 300 && i.h === 200 && i.ySampling === '1x1') ? true : JSON.stringify(i);
    });
    check('jpegInfo legge un campionamento 2x1', function () {
      return Whatsapp.jpegInfo(header(0xC0, 10, 10, [0x21, 0x11, 0x11])).ySampling === '2x1' ? true : 'diverso';
    });
    check('jpegInfo rifiuta byte che non sono un JPEG', function () {
      try { Whatsapp.jpegInfo(new Uint8Array([0x89, 0x50, 0x4E, 0x47])); } catch (e) { return (e instanceof Error && !(e instanceof ReferenceError)) ? true : 'errore inatteso: ' + e; }
      return 'non ha rifiutato';
    });
    check('jpegInfo rifiuta un JPEG senza SOF', function () {
      try { Whatsapp.jpegInfo(new Uint8Array([0xFF, 0xD8, 0xFF, 0xD9])); } catch (e) { return (e instanceof Error && !(e instanceof ReferenceError)) ? true : 'errore inatteso: ' + e; }
      return 'non ha rifiutato';
    });
  }

  function run(loaded) {
    var win = document.getElementById('app').contentWindow;
    var sf = win && win.ScanForge;
    if (!loaded) {
      check('iframe caricato', function () { return 'timeout: index.html non ha finito di caricare'; });
    }

    window.SF_API_MANIFEST.forEach(function (m) {
      check('esiste ' + m.path + ' (' + m.type + ')', function () {
        if (!sf) return 'ScanForge non definito';
        var v = resolve(sf, m.path);
        // typeof null e 'object': per i tipi 'object' escludo null
        if (m.type === 'object' && v === null) return 'null';
        return typeof v === m.type ? true : 'trovato ' + typeof v;
      });
    });

    check('apiVersion === 1', function () {
      return (sf && sf.apiVersion === 1) ? true : 'valore ' + (sf && sf.apiVersion);
    });
    check('version inizia per 0.3', function () {
      var v = sf && sf.version;
      return (typeof v === 'string' && v.indexOf('0.3') === 0) ? true : 'valore ' + v;
    });

    check('nessun attributo on* nel documento', function () {
      var doc = win && win.document;
      if (!doc) return 'documento non disponibile';
      var trovati = [];
      var all = doc.querySelectorAll('*');
      for (var i = 0; i < all.length; i++) {
        var attrs = all[i].attributes;
        for (var j = 0; j < attrs.length; j++) {
          if (/^on/i.test(attrs[j].name)) trovati.push(all[i].tagName.toLowerCase() + '[' + attrs[j].name + ']');
        }
      }
      // Elementi creati a runtime da template di stringhe nello script dell'app
      var app = doc.getElementById('sf-app');
      if (!app) return 'script sf-app non trovato';
      var re = /\son[a-z]+=["']/gi, m;
      while ((m = re.exec(app.textContent))) trovati.push('sf-app:' + m[0].trim());
      return trovati.length ? 'trovati: ' + trovati.slice(0, 5).join(', ') : true;
    });

    // Le prove sulle preferenze rimettono il valore salvato che trovano, invece di cancellarlo.
    function conPrefs(fn) {
      var prefs = win && win.prefs;
      if (!prefs || typeof prefs.get !== 'function' || typeof prefs.set !== 'function') return 'prefs non disponibile';
      var proto = win.Storage.prototype, get = proto.getItem, set = proto.setItem;
      var KEY = 'scanforge.prefs.v1', salvato = null;
      try { salvato = win.localStorage.getItem(KEY); win.localStorage.removeItem(KEY); } catch (e) { /* archiviazione assente */ }
      var splitPrima = prefs.get('split');
      try {
        return fn(prefs, proto);
      } finally {
        proto.getItem = get;
        proto.setItem = set;
        prefs.set('split', splitPrima);
        try {
          if (salvato === null) win.localStorage.removeItem(KEY);
          else win.localStorage.setItem(KEY, salvato);
        } catch (e) { /* archiviazione assente */ }
      }
    }
    function lancia(nome) {
      return function () { throw new win.DOMException('bloccato', nome); };
    }

    // Campo Progetto (nome del progetto): pannello del PC e schermata Esporta del telefono
    check('campo Progetto: presente, obbligatorio e prima di Cognome nel pannello e in Esporta', function () {
      var d = win.document;
      var coppie = [['nm-progetto', 'nm-cognome'], ['exp-progetto', 'exp-cognome']];
      for (var i = 0; i < coppie.length; i++) {
        var prog = d.getElementById(coppie[i][0]), cog = d.getElementById(coppie[i][1]);
        if (!prog) return coppie[i][0] + ' assente';
        if (prog.dataset.campo !== 'title') return coppie[i][0] + ' non è collegato a title';
        if (prog.getAttribute('aria-required') !== 'true') return coppie[i][0] + ' senza aria-required';
        if (prog.maxLength !== 80) return coppie[i][0] + ' maxlength ' + prog.maxLength;
        if (!(prog.compareDocumentPosition(cog) & win.Node.DOCUMENT_POSITION_FOLLOWING)) return coppie[i][0] + ' non precede Cognome';
        if (!d.querySelector('label[for="' + coppie[i][0] + '"]')) return coppie[i][0] + ' senza etichetta';
      }
      return true;
    });
    check('campo Progetto: il nome scritto va in intestazione e vuoto torna il proposto', function () {
      var d = win.document;
      var ev = function (name) { return new win.Event(name, { bubbles: true }); };
      var campo = d.getElementById('exp-progetto');
      var testa = d.getElementById('hdr-name');
      if (!campo || !testa) return 'elementi assenti';
      try {
        campo.value = 'Contratto Casa Milano';
        campo.dispatchEvent(ev('input'));
        if (testa.textContent !== 'Contratto Casa Milano') return 'intestazione: ' + testa.textContent;
        if (d.getElementById('nm-progetto').value !== 'Contratto Casa Milano') return 'pannello non allineato';
        campo.value = '   ';
        campo.dispatchEvent(ev('input'));
        campo.dispatchEvent(ev('blur'));
        if (campo.value !== 'Progetto') return 'dopo aver svuotato: ' + JSON.stringify(campo.value);
        if (testa.textContent !== 'Nuovo progetto') return 'intestazione vuota: ' + testa.textContent;
        return true;
      } finally {
        campo.value = '';
        campo.dispatchEvent(ev('input'));
        campo.dispatchEvent(ev('blur'));
      }
    });

    // Riga Tipo della colonna destra (e del telefono): cambia il tipo del documento o ne crea uno
    // con la sola foto da assegnare. Le prove girano una dopo l'altra sull'unica app dell'iframe.
    var codaTipo = Promise.resolve();
    function checkTipo(name, fn) {
      checkAsync(name, function () {
        var r = codaTipo.then(fn);
        codaTipo = r.then(function () {}, function () {});
        return r;
      });
    }
    function attendi(cond, ms) {
      var fine = Date.now() + (ms || 6000);
      return new Promise(function (ok, ko) {
        (function giro() {
          if (cond()) return ok();
          if (Date.now() > fine) return ko(new Error('timeout'));
          setTimeout(giro, 25);
        })();
      });
    }
    var PNG1 = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
    function preparaTipo(docs, nUn, aperta) {
      // docs: [{ typeId, n }]; le pagine sono t1, t2, ...; aperta: id della pagina mostrata in Correggi
      win.eval('(' + function (docs, nUn, aperta, png) {
        clearPractice();
        var k = 0, documents = [], unassigned = [];
        var pagina = function () {
          var id = 't' + (++k);
          state.pages.set(id, { id: id, originalSrc: png, name: id, settings: ScanForge.defaultSettings(), corners: null, width: 1, height: 1, needsCheck: false });
          return id;
        };
        docs.forEach(function (d, i) {
          var ids = []; for (var j = 0; j < d.n; j++) ids.push(pagina());
          documents.push({ id: 'd' + (i + 1), typeId: d.typeId, mode: null, pageIds: ids });
        });
        for (var u = 0; u < nUn; u++) unassigned.push(pagina());
        commit({ title: '', cognome: '', nome: '', documents: documents, unassigned: unassigned });
        selectPage(aperta);
      } + ')')(docs, nUn, aperta, PNG1);
    }
    function statoTipo() {
      return JSON.parse(win.eval('JSON.stringify({ overlay: state.overlay, docId: state.docId, pageId: state.pageId, ' +
        'documents: state.practice.documents, unassigned: state.practice.unassigned })'));
    }
    // Chiude la scelta aperta (così la cronologia dell'app resta coerente), poi svuota il progetto.
    function conPulizia(fn) {
      var fine = function () {
        return win.eval('closeOverlayThen()').then(function () { win.eval('clearPractice(); go("pratica", { replace: true })'); });
      };
      return Promise.resolve().then(fn).then(function (r) {
        return fine().then(function () { return r; });
      }, function (e) {
        return fine().then(function () { throw e; });
      });
    }
    function scegli(tipo) {
      var c = win.document.querySelector('#tp-types .chip[data-type="' + tipo + '"]');
      if (!c) return Promise.reject(new Error('chip ' + tipo + ' assente'));
      c.click();
      return attendi(function () { return statoTipo().overlay === null; }).catch(function () {
        throw new Error('la scelta non si è chiusa: ' + win.eval('state.overlay + "|" + state.depth + "|" + state.view + "|" + history.length'));
      });
    }
    checkTipo('riga Tipo: è un pulsante con etichetta accessibile e apre la scelta del tipo', function () {
      return conPulizia(function () {
        preparaTipo([{ typeId: 'contratto', n: 2 }], 0, 't1');
        var b = win.document.getElementById('tools-type');
        if (!b || b.tagName !== 'BUTTON') return 'non è un pulsante';
        if (b.getAttribute('aria-haspopup') !== 'dialog') return 'senza aria-haspopup';
        if (b.getAttribute('aria-label') !== 'Tipo: Contratto, cambia') return 'etichetta ' + b.getAttribute('aria-label');
        if (win.document.getElementById('tools-type-label').textContent !== 'Contratto') return 'testo';
        b.click();
        if (statoTipo().overlay !== 'tipo') return 'scelta non aperta: ' + statoTipo().overlay;
        if (win.document.getElementById('tp-title').textContent !== 'Tipo del documento') return 'titolo ' + win.document.getElementById('tp-title').textContent;
        var cur = win.document.querySelector('#tp-types .chip[data-type="contratto"]');
        if (!cur || cur.getAttribute('aria-pressed') !== 'true') return 'tipo attuale non segnato';
        return true;
      });
    });
    checkTipo('riga Tipo: scegliere un altro tipo cambia il tipo del documento', function () {
      return conPulizia(function () {
        preparaTipo([{ typeId: 'contratto', n: 1 }], 0, 't1');
        win.document.getElementById('tools-type').click();
        return scegli('fattura').then(function () {
          var st = statoTipo();
          if (st.documents.length !== 1 || st.documents[0].typeId !== 'fattura') return 'tipo ' + JSON.stringify(st.documents);
          return true;
        });
      });
    });
    checkTipo('riga Tipo: una foto da assegnare diventa un documento con quella sola foto', function () {
      return conPulizia(function () {
        preparaTipo([], 2, 't1');
        var b = win.document.getElementById('tools-type');
        if (b.getAttribute('aria-label') !== 'Tipo: Da assegnare, scegli') return 'etichetta ' + b.getAttribute('aria-label');
        b.click();
        var titolo = win.document.getElementById('tp-title').textContent;
        return scegli('contratto').then(function () {
          if (titolo !== 'Crea documento con 1 foto') return 'titolo ' + titolo;
          var st = statoTipo();
          if (st.documents.length !== 1 || JSON.stringify(st.documents[0].pageIds) !== '["t1"]') return 'documenti ' + JSON.stringify(st.documents);
          if (st.documents[0].typeId !== 'contratto') return 'tipo ' + st.documents[0].typeId;
          if (JSON.stringify(st.unassigned) !== '["t2"]') return 'restano ' + JSON.stringify(st.unassigned);
          if (st.docId !== st.documents[0].id) return 'Correggi non segue il nuovo documento: ' + st.docId;
          return true;
        });
      });
    });
    checkTipo('riga Tipo: le tessere sono disabilitate per un documento di tre pagine', function () {
      return conPulizia(function () {
        preparaTipo([{ typeId: 'contratto', n: 3 }], 0, 't1');
        win.document.getElementById('tools-type').click();
        var c = win.document.querySelector('#tp-types .chip[data-type="cie"]');
        if (!c || !c.disabled) return 'la tessera non è disabilitata';
        return true;
      });
    });
    checkTipo('riga Tipo: la scelta del tipo per le foto selezionate resta com\u2019era', function () {
      return conPulizia(function () {
        preparaTipo([], 3, 't1');
        win.eval('selection.add("t1"); selection.add("t2"); openTypeChooser()');
        if (statoTipo().overlay !== 'tipo') return 'scelta non aperta';
        if (win.document.getElementById('tp-title').textContent !== 'Crea documento con 2 foto') return 'titolo ' + win.document.getElementById('tp-title').textContent;
        return true;
      });
    });

    // Nome del progetto: con "Uno per documento" ogni PDF modificabile porta il nome, e mentre si scrive
    // nel campo i ridisegni non lo sovrascrivono con la proposta.
    checkTipo('nome del progetto: projectBytes di un gruppo e del progetto intero conservano title', function () {
      return conPulizia(function () {
        preparaTipo([{ typeId: 'contratto', n: 1 }, { typeId: 'fattura', n: 1 }], 0, 't1');
        win.eval('commit(Object.assign({}, state.practice, { title: "Contratto Casa Milano" }))');
        var leggi = function (b) { return win.ScanForge.io.parseProject(new win.TextDecoder().decode(b)).practice; };
        var gruppo = leggi(win.eval('projectBytes({ items: [{ pageId: "t1" }], docIds: ["d1"] })'));
        if (gruppo.title !== 'Contratto Casa Milano') return 'gruppo: ' + JSON.stringify(gruppo.title);
        if (gruppo.documents.length !== 1) return 'gruppo con ' + gruppo.documents.length + ' documenti';
        var intero = leggi(win.eval('projectBytes()'));
        if (intero.title !== 'Contratto Casa Milano') return 'intero: ' + JSON.stringify(intero.title);
        return true;
      });
    });
    checkTipo('campo Progetto: con il fuoco non si sovrascrive, uscendo torna la proposta', function () {
      return conPulizia(function () {
        preparaTipo([{ typeId: 'contratto', n: 1 }], 0, 't1');
        var ev = function (name) { return new win.Event(name, { bubbles: true }); };
        var campo = win.document.getElementById('exp-progetto');
        win.eval('commit(Object.assign({}, state.practice, { title: "Mio" }))');
        win.eval('go("esporta")');
        campo.focus();
        if (win.document.activeElement !== campo) return 'il campo non ha preso il fuoco';
        campo.value = '';
        campo.dispatchEvent(ev('input'));
        win.eval('render()');
        if (campo.value !== '') return 'sovrascritto mentre si scrive: ' + JSON.stringify(campo.value);
        campo.blur();
        campo.dispatchEvent(ev('blur'));
        if (campo.value !== 'Contratto') return 'dopo il fuoco: ' + JSON.stringify(campo.value);
        return true;
      });
    });

    // Regola: interruttori Specchia e Bilanciamento del bianco (valori di fabbrica non scritti nelle impostazioni)
    function impostazioniDi(id) { return JSON.parse(win.eval('JSON.stringify(state.pages.get("' + id + '").settings)')); }
    function modoPagina(id, mode, docType) {
      win.eval('(function () { var p = state.pages.get("' + id + '"); p.settings = Object.assign({}, p.settings, { mode: "' + mode + '", docType: "' + docType + '" }); render(); })()');
    }
    checkTipo('Regola: Specchia in orizzontale e in verticale alternano e si scrivono solo se attivi', function () {
      return conPulizia(function () {
        preparaTipo([{ typeId: 'contratto', n: 1 }], 0, 't1');
        modoPagina('t1', 'grigi', 'foglio');
        var d = win.document;
        var ids = ['rg-flipH', 'rg-flipV'], chiavi = ['flipH', 'flipV'];
        for (var i = 0; i < 2; i++) {
          var b = d.getElementById(ids[i]);
          if (!b || b.getAttribute('role') !== 'switch') return ids[i] + ' non è un interruttore';
          if (!d.getElementById(ids[i] + '-l') || d.getElementById(ids[i] + '-l').textContent.indexOf('Specchia') !== 0) return ids[i] + ' senza etichetta';
          if (b.getAttribute('aria-checked') !== 'false') return ids[i] + ' acceso in partenza';
          b.click();
          if (impostazioniDi('t1')[chiavi[i]] !== true || b.getAttribute('aria-checked') !== 'true') return ids[i] + ' non si accende';
        }
        d.getElementById('rg-flipH').click();
        var s = impostazioniDi('t1');
        if ('flipH' in s) return 'flipH spento resta scritto: ' + JSON.stringify(s.flipH);
        if (s.flipV !== true) return 'flipV perso';
        d.querySelector('[data-reset="geometria"]').click();
        s = impostazioniDi('t1');
        if ('flipV' in s || d.getElementById('rg-flipV').getAttribute('aria-checked') !== 'false') return 'Ripristina non spegne lo specchio';
        return true;
      });
    });
    checkTipo('Regola: il bilanciamento del bianco compare per le tessere in Colori e si spegne con false', function () {
      return conPulizia(function () {
        preparaTipo([{ typeId: 'cie', n: 1 }], 0, 't1');
        var d = win.document, riga = d.querySelector('.rg-row[data-row="bilanciaBianco"]'), b = d.getElementById('rg-bilanciaBianco');
        if (!riga || !b) return 'riga assente';
        modoPagina('t1', 'colori', 'identita');
        if (riga.hidden) return 'nascosta per una tessera in Colori';
        if (b.getAttribute('aria-checked') !== 'true') return 'spento in partenza';
        b.click();
        if (impostazioniDi('t1').bilanciaBianco !== false || b.getAttribute('aria-checked') !== 'false') return 'non si spegne';
        b.click();
        if ('bilanciaBianco' in impostazioniDi('t1')) return 'acceso resta scritto';
        modoPagina('t1', 'grigi', 'identita');
        if (!riga.hidden) return 'visibile in Grigi';
        modoPagina('t1', 'colori', 'foglio');
        if (!riga.hidden) return 'visibile per un foglio';
        return true;
      });
    });

    check('prefs funziona con localStorage che lancia', function () {
      return conPrefs(function (prefs, proto) {
        proto.getItem = lancia('SecurityError');
        proto.setItem = lancia('SecurityError');
        if (prefs.get('split') !== false) return 'split ' + prefs.get('split');
        if (prefs.get('theme') !== 'system') return 'theme ' + prefs.get('theme');
        if (prefs.get('editablePdf') !== false) return 'editablePdf ' + prefs.get('editablePdf');
        prefs.set('split', true);
        // La scelta vale almeno per la sessione anche senza archiviazione
        if (prefs.get('split') !== true) return 'set senza archiviazione perso';
        return true;
      });
    });

    check('prefs tiene il valore se solo la scrittura fallisce', function () {
      return conPrefs(function (prefs, proto) {
        proto.setItem = lancia('QuotaExceededError');
        prefs.set('split', true);
        if (prefs.get('split') !== true) return 'split ' + prefs.get('split') + ' dopo set fallito';
        return true;
      });
    });

    ioTests(sf, win);
    convertTests(sf, win);
    whatsappTests();
    topLevelTests(sf, win);

    return Promise.all(pending).then(render);
  }

  function render() {
    var pass = rows.filter(function (r) { return r.ok; }).length;
    var fail = rows.length - pass;
    var tbody = document.querySelector('#results tbody');
    rows.forEach(function (r) {
      var tr = document.createElement('tr');
      [r.name, r.ok ? 'OK' : 'KO', r.detail].forEach(function (txt, i) {
        var td = document.createElement('td');
        td.textContent = txt;
        if (i === 1) td.className = r.ok ? 'pass' : 'fail';
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    document.getElementById('summary').textContent = 'Passati: ' + pass + ' - Falliti: ' + fail;
    window.__api = { summary: { pass: pass, fail: fail }, failures: failures, warnings: warnings };
    if (warnings.length) {
      var w = document.createElement('p');
      w.id = 'warnings';
      w.textContent = 'Avvisi: ' + warnings.join('; ');
      document.body.appendChild(w);
    }
    var fine = document.createElement('p');
    fine.textContent = 'FINE';
    document.body.appendChild(fine);
  }

  // Il load dell'iframe può essere già scattato prima di questo script: si controlla readyState,
  // e un tetto di 15 s garantisce che la pagina arrivi comunque a FINE.
  var frame = document.getElementById('app');
  var done = false, timer = null;
  function go(loaded) {
    if (done) return;
    done = true;
    clearTimeout(timer);
    new Promise(function (res) { res(run(loaded)); }).catch(function (e) {
      check('errore del contratto', function () { return String(e && e.message || e); });
      render();
    });
  }
  timer = setTimeout(function () { go(false); }, 15000);
  var cd = null;
  try { cd = frame.contentDocument; } catch (e) { cd = null; }
  if (cd && cd.readyState === 'complete' && frame.contentWindow.location.pathname === '/index.html') go(true);
  else frame.addEventListener('load', function () { go(true); });
})();
</script>
